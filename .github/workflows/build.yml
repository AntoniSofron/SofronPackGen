name: Validate worldgen rewrite
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Check worldgen JSON
        run: python3 -c "import json,pathlib; a=list(pathlib.Path('src/main/resources').rglob('*.json')); [json.loads(p.read_text()) for p in a]; print(len(a),'valid JSON files')"
      - name: Compile
        run: gradle build --stacktrace
