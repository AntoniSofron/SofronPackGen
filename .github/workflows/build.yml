name: Sofron Terra Lab — compile and validate (Minecraft 26.3)
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate exactly 84 approved settings and safe active worldgen
        run: |
          python3 scripts/validate_design.py
          python3 scripts/validate_implementation.py
          python3 scripts/validate_willow_templates.py
      - name: Compile real Minecraft 26.3 Fabric worldgen
        run: |
          gradle --no-daemon build --stacktrace
          python3 scripts/check_grounded_mountains.py
      - name: Verify distributable Fabric JAR and real overworld data pack
        run: |
          python3 - <<'PY'
          import json,pathlib,zipfile
          jars=[x for x in pathlib.Path('build/libs').glob('*.jar') if not x.name.endswith(('-sources.jar','-dev.jar'))]
          assert len(jars)==1,jars
          with zipfile.ZipFile(jars[0]) as z:
              m=json.loads(z.read('fabric.mod.json'))
              assert m['id']=='sofron_terra_lab',m
              assert 'pl/sofron/terralab/TerraLabMod.class' in z.namelist()
              assert 'data/minecraft/worldgen/noise_settings/overworld.json' in z.namelist()
              swamp=json.loads(z.read('data/minecraft/worldgen/biome/swamp.json'))
              assert swamp['effects']['grass_color'] == '#688D46'
              assert 'sofron_terra_lab:swamp_willows' in swamp['features'][9]
              for i in range(1, 6):
                  assert f'data/sofron_terra_lab/structure/swamp_willow_{i}.nbt' in z.namelist()
              assert 'data/sofron_terra_lab/worldgen/feature/swamp_willows.json' in z.namelist()
              assert 'data/sofron_terra_lab/worldgen/placed_feature/swamp_willows.json' in z.namelist()
              assert swamp['effects']['foliage_color'] == '#688D46'
              assert swamp['effects']['water_color'] == '#68834D'
              assert swamp['attributes']['minecraft:visual/sky_color'] == '#98C9D9'
              assert 'data/sofron_terra_lab/worldgen/density_function/terrain/final_density.json' in z.namelist()
          print('PASS: real worldgen bundled:',jars[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sofron-Terra-Lab-MC26.3-Worldgen
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
