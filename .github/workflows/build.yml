name: Clean-room design scaffold build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate question catalog and clean-room scope
        run: python3 scripts/validate_design.py
      - name: Compile fresh Fabric mod scaffold
        run: gradle --no-daemon build --stacktrace
      - name: Check distributable JAR metadata
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          jars=[x for x in pathlib.Path('build/libs').glob('*.jar') if not x.name.endswith(('-sources.jar','-dev.jar'))]
          assert len(jars)==1,jars
          with zipfile.ZipFile(jars[0]) as z:
              m=json.loads(z.read('fabric.mod.json'))
              assert m['id']=='sofron_terra_lab'
              assert 'pl/sofron/terralab/TerraLabMod.class' in z.namelist()
          print('PASS:',jars[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Sofron-Terra-Lab-DESIGN-ONLY
          path: build/libs/*.jar
          if-no-files-found: error
