name: Validate Sofron Pack Gen 2
on:
  push:
    branches: [rewrite/sofron-pack-gen-2-from-scratch]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate JSON files
        run: python3 -c "import json,pathlib; files=list(pathlib.Path('src/main/resources').rglob('*.json')); [json.loads(p.read_text()) for p in files]; print('JSON parsed:',len(files))"
      - name: Compile and package
        run: gradle build --stacktrace
